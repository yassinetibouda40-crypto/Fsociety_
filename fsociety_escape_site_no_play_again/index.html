<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSOCIETY — Escape</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#030303;color:#eee;font-family:Consolas,"Courier New",monospace;display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,0,0,.035) 4px 5px);opacity:.8}
.page{width:min(900px,94vw);text-align:center;padding:28px 12px;position:relative}
.logo{width:min(260px,55vw);max-height:260px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,0,0,.28))}
h1{font-size:clamp(40px,8vw,76px);letter-spacing:.2em;margin:5px 0 10px;text-shadow:3px 0 #900,-2px 0 #555}
.warning{color:#f22;font-size:clamp(18px,3vw,29px);font-weight:900}
.sub{margin:14px 0;color:#ddd;line-height:1.7}
hr{border:0;border-top:1px solid #8d1111;width:70%;margin:25px auto}
.prompt{font-size:18px;margin-bottom:12px}
.form{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
input{width:min(430px,78vw);padding:14px;background:#080808;color:#fff;border:2px solid #d00;outline:0;font:inherit;text-align:center}
button{padding:14px 22px;background:#080808;color:#f22;border:2px solid #d00;font:700 16px Consolas,monospace;cursor:pointer}
button:hover{background:#d00;color:#000}
#error{height:24px;margin-top:10px;color:#f44}
.shake{animation:shake .25s linear}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#success{display:none}
.success-box{margin:25px auto;padding:30px 20px;max-width:720px;border:2px solid #00ff66;color:#00ff66;box-shadow:0 0 30px rgba(0,255,100,.12)}
.check{font-size:58px} .success-title{font-size:clamp(24px,5vw,42px);font-weight:900;margin:8px 0}
.success-text{line-height:1.8}
.again{margin-top:20px;border-color:#00ff66;color:#00ff66} .again:hover{background:#00ff66;color:#000}
</style>
</head>
<body>

<section class="page" id="locked">
  <img class='logo' src='fsociety.jpg' alt='FSociety'>
  <h1>FSOCIETY</h1>
  <div class="warning">YOU HAVE BEEN HACKED BY FSOCIETY</div>
  <div class="sub">Your system is now under our control.<br>There is no escape... unless you can prove you're worthy.</div>
  <hr>
  <div class="prompt">Enter the code to escape:</div>
  <form class="form" id="escapeForm">
    <input id="code" type="password" placeholder="ENTER ESCAPE CODE" autocomplete="off" autofocus>
    <button type="submit">SUBMIT</button>
  </form>
  <div id="error"></div>
</section>

<section class="page" id="success">
  <img class='logo' src='fsociety.jpg' alt='FSociety'>
  <h1>FSOCIETY</h1>
  <div class="success-box">
    <div class="check">✓</div>
    <div class="success-title">YOU ESCAPE SECSSEFULY</div>
    <div class="success-text">The system is now free.<br>You are no longer under our control.</div>
  </div>
</section>

<script>
const correctCode="fsociety34";
const form=document.getElementById("escapeForm");
const input=document.getElementById("code");
const error=document.getElementById("error");

form.addEventListener("submit",function(e){
  e.preventDefault();
  if(input.value===correctCode){
    document.getElementById("locked").style.display="none";
    document.getElementById("success").style.display="block";
  }else{
    error.textContent="ACCESS DENIED — WRONG CODE";
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
    input.select();
  }
});
</script>
</body>
</html>
